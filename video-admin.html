<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>動画 追加・管理ツール</title>
<style>
  :root{
    --bg:#0a0e1a; --bg2:#0e1424; --card:#121a2e; --line:#22304e; --line2:#2c3c5e;
    --tx:#e8eefc; --sub:#8ba0c8; --dim:#5d6f93;
    --cy:#19e3ff; --mg:#ff3df2; --gr:#22e3a0; --rd:#ff3d5e; --yl:#ffc23d;
    --yt:#ff0033; --tt:#00f2ea; --xx:#1d9bf0;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{background:var(--bg);color:var(--tx);font-family:-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
    padding:max(10px,env(safe-area-inset-top)) 12px calc(28px + env(safe-area-inset-bottom)); line-height:1.5; -webkit-text-size-adjust:100%}
  .wrap{max-width:560px;margin:0 auto}

  /* gate */
  #gate{min-height:78vh;display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:center}
  #gate .logo{font-weight:800;font-size:22px;letter-spacing:.04em}
  #gate .logo b{color:var(--cy)} #gate .logo i{color:var(--mg);font-style:normal}
  #gate p{color:var(--sub);font-size:13px;margin:0}
  .keyrow{display:flex;gap:8px;margin-top:6px}
  input[type=password],input[type=text],input[type=url]{flex:1;width:100%;background:var(--bg2);border:1px solid var(--line2);color:var(--tx);
    border-radius:12px;padding:14px 14px;font-size:16px;outline:none}
  input:focus{border-color:var(--cy)}
  .btn{appearance:none;border:0;border-radius:12px;padding:14px 16px;font-size:15px;font-weight:700;cursor:pointer;color:#04121a;
    background:var(--cy);transition:transform .08s,opacity .2s;white-space:nowrap}
  .btn:active{transform:scale(.97)}
  .btn[disabled]{opacity:.5;cursor:default}
  .btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--sub)}
  .btn.gr{background:var(--gr);color:#04190f}
  .btn.full{width:100%}

  /* app */
  #app{display:none}
  .top{display:flex;align-items:center;gap:8px;padding:4px 2px 12px}
  .top .ttl{font-weight:800;font-size:18px;flex:1}
  .top .ttl span{color:var(--cy)}
  .chip{font-size:12px;color:var(--sub);background:var(--bg2);border:1px solid var(--line);border-radius:99px;padding:5px 10px}
  .ico{width:40px;height:40px;border-radius:11px;border:1px solid var(--line2);background:var(--bg2);color:var(--sub);
    font-size:17px;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .ico:active{transform:scale(.95)}

  /* tabs */
  .tabs{display:flex;gap:6px;background:var(--bg2);border:1px solid var(--line);border-radius:13px;padding:5px;margin-bottom:16px}
  .tabs button{flex:1;appearance:none;border:0;background:transparent;color:var(--sub);font-size:14px;font-weight:700;padding:11px 8px;border-radius:9px;cursor:pointer}
  .tabs button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 0 rgba(0,0,0,.35)}
  .panel{display:none} .panel.on{display:block}

  .addcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
  .addcard .lab{font-size:13px;color:var(--sub);margin:0 2px 8px}
  .addrow{display:flex;gap:8px}
  .hint{font-size:11.5px;color:var(--dim);margin:9px 2px 0}
  .msg{font-size:13px;margin:10px 2px 0;min-height:18px}
  .msg.ok{color:var(--gr)} .msg.err{color:var(--rd)} .msg.run{color:var(--yl)}

  /* preview */
  .preview{margin-top:14px;border-top:1px dashed var(--line2);padding-top:14px}
  .pvhead{display:flex;align-items:center;gap:8px;margin-bottom:10px;justify-content:center}
  .pvid{font-size:11px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .vframe{position:relative;width:100%;max-width:300px;margin:0 auto;aspect-ratio:9/16;min-height:380px;background:#000;border-radius:14px;overflow:hidden;border:1px solid var(--line2)}
  .vframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .vframe .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:12.5px;text-align:center;padding:22px;line-height:1.7}
  .pvact{display:flex;gap:8px;margin:12px auto 0;max-width:300px}
  .pvact .btn.gr{flex:1}
  .pvnote{font-size:11.5px;color:var(--yl);margin-top:9px;text-align:center}

  /* list */
  .listhead{display:flex;align-items:center;gap:8px;margin:0 2px 12px}
  .listhead .t{font-size:13px;color:var(--sub);font-weight:700;letter-spacing:.04em;flex:1}
  .vid{display:flex;gap:11px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px;align-items:center}
  .vid .thumb{width:84px;height:60px;flex:none;border-radius:9px;overflow:hidden;background:var(--bg2);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;position:relative}
  .vid .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .vid .thumb .ph{font-size:22px;opacity:.6}
  .vid .body{flex:1;min-width:0}
  .vid .name{font-size:13.5px;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
  .vid .meta{display:flex;align-items:center;gap:7px;margin-top:5px;flex-wrap:wrap}
  .pf{font-size:10px;font-weight:800;letter-spacing:.04em;border-radius:6px;padding:2px 7px;color:#fff}
  .pf.youtube{background:var(--yt)} .pf.tiktok{background:#111;border:1px solid var(--tt);color:var(--tt)} .pf.x{background:#000;border:1px solid #2a3a55}
  .vid .auth{font-size:11px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}
  .vid .url{font-size:10.5px;color:var(--dim);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .vid .acts{display:flex;flex-direction:column;gap:6px;flex:none}
  .mini{width:38px;height:33px;border-radius:9px;border:1px solid var(--line2);background:transparent;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .mini.edit{color:var(--cy)} .mini.del{color:var(--rd)}
  .mini:active{transform:scale(.92)}

  /* edit (inline) */
  .vid.editing{display:block;border-color:var(--cy)}
  .editbox{width:100%}
  .ehead{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--tx);margin-bottom:4px}
  .editbox label{display:block;font-size:11px;color:var(--sub);margin:10px 2px 5px}
  .ein{width:100%;background:var(--bg2);border:1px solid var(--line2);color:var(--tx);border-radius:10px;padding:11px 12px;font-size:15px;outline:none}
  .ein:focus{border-color:var(--cy)}
  .erow{display:flex;gap:8px;margin-top:13px}
  .erow .btn{flex:1}
  .emsg{font-size:12px;margin-top:8px;min-height:16px}
  .emsg.err{color:var(--rd)} .emsg.run{color:var(--yl)} .emsg.ok{color:var(--gr)}

  .empty{text-align:center;color:var(--dim);font-size:13px;padding:34px 16px;border:1px dashed var(--line2);border-radius:14px}
  .foot{margin-top:18px;text-align:center;color:var(--dim);font-size:11px;line-height:1.7}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line2);border-top-color:var(--cy);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* toast */
  #toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
    background:#06351f;border:1px solid var(--gr);color:#b9ffe2;padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:700;
    opacity:0;pointer-events:none;transition:.25s;z-index:9999;max-width:90vw;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.bad{background:#3a0d16;border-color:var(--rd);color:#ffc6cf}
</style>
</head>
<body>
<div class="wrap">

  <!-- ===== ロック画面 ===== -->
  <div id="gate">
    <div class="logo"><b>APEX</b> 動画 <i>管理ツール</i></div>
    <p>運営専用。追加・管理用の<b>鍵</b>を入力してください。<br>（GASの ADMIN_KEY と同じ文字列）</p>
    <div class="keyrow">
      <input id="keyIn" type="password" placeholder="鍵を入力" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
      <button class="btn" id="unlockBtn">解除</button>
    </div>
    <p id="gateMsg" style="color:var(--rd);min-height:18px"></p>
  </div>

  <!-- ===== 本体 ===== -->
  <div id="app">
    <div class="top">
      <div class="ttl"><span>🎬</span> 動画 管理</div>
      <div class="chip" id="cntChip">―</div>
      <div class="ico" id="reloadBtn" title="再読み込み">↻</div>
      <div class="ico" id="keyBtn" title="鍵を変更">🔑</div>
    </div>

    <div class="tabs">
      <button id="tabAdd" class="on" data-tab="add">＋ 追加</button>
      <button id="tabMng" data-tab="manage">📋 一覧・管理</button>
    </div>

    <!-- 追加タブ -->
    <div id="panel-add" class="panel on">
      <div class="addcard">
        <div class="lab">YouTube ・ X ・ TikTok の共有URLを貼る → <b>確認</b> → <b>本体に登録</b></div>
        <div class="addrow">
          <input id="urlIn" type="url" inputmode="url" placeholder="https://…" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
          <button class="btn" id="checkBtn">▶ 確認</button>
        </div>
        <div class="hint">まず「確認」で実際に再生チェック。問題なければ「本体に登録」でキューに入ります。</div>
        <div class="msg" id="addMsg"></div>

        <div id="preview" class="preview" style="display:none">
          <div class="pvhead"><span class="pf" id="pvPf"></span><span class="pvid" id="pvId"></span></div>
          <div class="vframe" id="vframe"></div>
          <div class="pvact">
            <button class="btn gr" id="commitBtn">✓ 本体に登録</button>
            <button class="btn ghost" id="resetBtn">別のURL</button>
          </div>
          <div class="pvnote" id="pvNote"></div>
        </div>
      </div>
    </div>

    <!-- 一覧・管理タブ -->
    <div id="panel-manage" class="panel">
      <div class="listhead"><span class="t" id="listTtl">登録済みの動画</span><span class="ico" id="reloadBtn2" title="再読み込み" style="width:34px;height:34px;font-size:15px">↻</span></div>
      <div id="list"></div>
    </div>

    <div class="foot">
      追加した動画は、アプリ側で<b>リロードするたびランダム順</b>に表示されます。<br>
      ※ 出るのは<b>あなたが選んだ動画だけ</b>。公開投稿はありません。
    </div>
  </div>

</div>

<div id="toast"></div>

<script>
/* ====== 動画GAS（アプリと同じデプロイ） ====== */
var BK_URL = 'https://script.google.com/macros/s/AKfycbyly42kFF4exLzxujawy24J67rGKc3frZlGIBKaNTe_K06CA5KHOykjUO8lWZi7mjs_UA/exec';
var KEYLS  = 'bkadm_key';

/* ====== JSONP（タイムアウト付き Promise） ====== */
function call(action, params){
  return new Promise(function(resolve){
    var name = '__bk' + Date.now() + Math.floor(Math.random()*1e6);
    var done = false, s = document.createElement('script');
    var timer = setTimeout(function(){ finish({ok:false, error:'タイムアウト（通信に失敗しました）'}); }, 15000);
    function clean(){ clearTimeout(timer); try{ delete window[name]; }catch(e){ window[name]=undefined; } if(s.parentNode) s.parentNode.removeChild(s); }
    function finish(d){ if(done) return; done=true; clean(); resolve(d || {ok:false, error:'空の応答'}); }
    window[name] = function(d){ finish(d); };
    var q = 'action=' + encodeURIComponent(action) + '&callback=' + name;
    for (var k in params){ if(params[k]!=null) q += '&' + encodeURIComponent(k) + '=' + encodeURIComponent(params[k]); }
    s.onerror = function(){ finish({ok:false, error:'通信エラー（URL/ネット環境を確認）'}); };
    s.src = BK_URL + '?' + q;
    document.body.appendChild(s);
  });
}

var $ = function(id){ return document.getElementById(id); };
var KEY = '', VIDS = [], editingId = null;

/* ====== トースト ====== */
var _tt;
function toast(msg, bad){
  var t = $('toast'); t.textContent = msg; t.className = 'show' + (bad?' bad':'');
  clearTimeout(_tt); _tt = setTimeout(function(){ t.className = bad?'bad':''; }, 2200);
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function pfLabel(p){ return p==='youtube'?'YouTube':p==='tiktok'?'TikTok':p==='x'?'X':p; }

/* ====== ロック ====== */
function showApp(){ $('gate').style.display='none'; $('app').style.display='block'; }
function showGate(){ $('app').style.display='none'; $('gate').style.display='flex'; $('keyIn').value=''; $('gateMsg').textContent=''; }

async function unlock(){
  var k = $('keyIn').value.trim();
  if(!k){ $('gateMsg').textContent='鍵を入力してください'; return; }
  $('unlockBtn').disabled = true; $('gateMsg').innerHTML='<span class="spin"></span>確認中…';
  var r = await call('mlist', {key:k});
  $('unlockBtn').disabled = false;
  if(r && r.ok){
    KEY = k; try{ localStorage.setItem(KEYLS, k); }catch(e){}
    showApp(); paint(r.videos||[]);
  } else {
    $('gateMsg').textContent = (r && r.error==='forbidden') ? '鍵が違います' : ('エラー：' + ((r&&r.error)||'不明'));
  }
}

/* ====== タブ ====== */
function switchTab(name){
  var add = (name==='add');
  $('tabAdd').classList.toggle('on', add);
  $('tabMng').classList.toggle('on', !add);
  $('panel-add').classList.toggle('on', add);
  $('panel-manage').classList.toggle('on', !add);
}

/* ====== 追加：判定/ID抽出/埋め込み（GASと同じ規則） ====== */
function detect(url){
  if(/(?:youtube\.com|youtu\.be)\//i.test(url)) return 'youtube';
  if(/tiktok\.com\//i.test(url))                return 'tiktok';
  if(/(?:x\.com|twitter\.com)\//i.test(url))    return 'x';
  return '';
}
function extractId(p, url){
  var m;
  if(p==='youtube'){ m=url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:[^&]*&)*v=|shorts\/|embed\/|live\/))([A-Za-z0-9_-]{11})/); return m?m[1]:''; }
  if(p==='tiktok'){  m=url.match(/\/video\/(\d{6,25})/) || url.match(/tiktok\.com\/.*?(\d{8,25})/); return m?m[1]:''; }
  if(p==='x'){       m=url.match(/(?:x|twitter)\.com\/[^\/]+\/status\/(\d{6,25})/) || url.match(/\/status\/(\d{6,25})/); return m?m[1]:''; }
  return '';
}
function embedUrl(p, id){
  if(p==='youtube') return 'https://www.youtube.com/embed/' + id + '?playsinline=1&rel=0';
  if(p==='x')       return 'https://platform.twitter.com/embed/Tweet.html?id=' + id;
  if(p==='tiktok')  return 'https://www.tiktok.com/embed/v2/' + id;
  return '';
}
var CURRENT_URL = '';

function previewVideo(){
  var url = $('urlIn').value.trim(), msg = $('addMsg');
  resetPreview();
  if(!url){ msg.className='msg err'; msg.textContent='URLを貼ってください'; return; }
  if(!/^https?:\/\//i.test(url)){ msg.className='msg err'; msg.textContent='URLは https://… の形で貼ってください'; return; }
  var p = detect(url);
  if(!p){ msg.className='msg err'; msg.textContent='YouTube / X / TikTok のURLだけ対応です'; return; }
  CURRENT_URL = url; msg.className='msg'; msg.textContent='';
  $('pvPf').className = 'pf ' + p; $('pvPf').textContent = pfLabel(p);
  var id = extractId(p, url), vf = $('vframe');
  if(id){
    $('pvId').textContent = 'ID: ' + id;
    vf.innerHTML = '<iframe src="'+embedUrl(p,id)+'" allow="autoplay;encrypted-media;picture-in-picture;web-share;fullscreen" allowfullscreen loading="lazy"></iframe>';
    $('pvNote').textContent = '▶ 実際に再生して確認 → OKなら「本体に登録」';
  } else {
    $('pvId').textContent = '';
    vf.innerHTML = '<div class="ph">短縮URLのため、ここでは再生確認できません。<br>フル尺のURL（…/video/数字 など）を貼ると確認できます。<br><br>このまま「本体に登録」すると、サーバー側で解決して登録します。</div>';
    $('pvNote').textContent = '⚠ ここでは確認不可。登録自体は可能（サーバーが解決）。';
  }
  $('preview').style.display = 'block';
  try{ $('preview').scrollIntoView({behavior:'smooth', block:'nearest'}); }catch(e){}
}

async function commitVideo(){
  if(!CURRENT_URL) return;
  var msg = $('addMsg');
  $('commitBtn').disabled = true; msg.className='msg run'; msg.innerHTML='<span class="spin"></span>本体に登録中…';
  var r = await call('add', {key:KEY, url:CURRENT_URL});
  $('commitBtn').disabled = false;
  if(r && r.ok){
    msg.className='msg ok'; msg.textContent='✓ 本体に登録しました：' + ((r.video&&r.video.title)||'');
    toast('✓ 本体のキューに追加');
    resetPreview(); $('urlIn').value=''; reload();
  } else {
    if(r && r.error==='forbidden'){ toast('鍵が無効です', true); showGate(); return; }
    msg.className='msg err'; msg.textContent='× ' + ((r&&r.error)||'登録に失敗しました');
  }
}
function resetPreview(){ $('preview').style.display='none'; $('vframe').innerHTML=''; CURRENT_URL=''; }

/* ====== 一覧描画 ====== */
function paint(videos){ VIDS = videos || []; editingId = null; renderList(); }
function updateCount(){ var n=VIDS.length; $('cntChip').textContent = n+' 本'; $('listTtl').textContent = '登録済みの動画（'+n+'）'; }

function viewCard(v){
  var thumb = v.thumb
    ? '<img src="'+esc(v.thumb)+'" alt="" loading="lazy" onerror="this.parentNode.innerHTML=&quot;<span class=\\&quot;ph\\&quot;>🎬</span>&quot;">'
    : '<span class="ph">🎬</span>';
  var auth = v.author ? '<span class="auth">'+esc(v.author)+'</span>' : '';
  return '<div class="vid" data-id="'+esc(v.id)+'">'
    + '<div class="thumb">'+thumb+'</div>'
    + '<div class="body">'
    +   '<div class="name">'+esc(v.title||'(タイトル未取得)')+'</div>'
    +   '<div class="meta"><span class="pf '+esc(v.platform)+'">'+pfLabel(v.platform)+'</span>'+auth+'</div>'
    +   '<div class="url">'+esc(v.url)+'</div>'
    + '</div>'
    + '<div class="acts">'
    +   '<button class="mini edit" data-edit="'+esc(v.id)+'" title="修正">✎</button>'
    +   '<button class="mini del" data-del="'+esc(v.id)+'" title="削除">🗑</button>'
    + '</div>'
    + '</div>';
}
function editCard(v){
  return '<div class="vid editing" data-id="'+esc(v.id)+'">'
    + '<div class="editbox">'
    +   '<div class="ehead"><span class="pf '+esc(v.platform)+'">'+pfLabel(v.platform)+'</span> 修正</div>'
    +   '<label>タイトル（空欄のままURLを差し替えると自動取得）</label>'
    +   '<input class="ein etitle" value="'+esc(v.title||'')+'">'
    +   '<label>URL（差し替える時だけ変更。変えなければそのまま）</label>'
    +   '<input class="ein eurl" value="'+esc(v.url||'')+'">'
    +   '<div class="erow"><button class="btn gr" data-save="'+esc(v.id)+'">保存</button><button class="btn ghost" data-cancel="1">キャンセル</button></div>'
    +   '<div class="emsg"></div>'
    + '</div></div>';
}
function renderList(){
  updateCount();
  var box = $('list');
  if(!VIDS.length){ box.innerHTML = '<div class="empty">まだ動画がありません。<br>「＋ 追加」タブから登録してください。</div>'; return; }
  box.innerHTML = VIDS.map(function(v){ return String(v.id)===String(editingId) ? editCard(v) : viewCard(v); }).join('');
}

async function reload(){
  $('cntChip').textContent = '…';
  var r = await call('mlist', {key:KEY});
  if(r && r.ok){ paint(r.videos||[]); }
  else if(r && r.error==='forbidden'){ showGate(); }
  else { toast('読み込み失敗', true); $('cntChip').textContent='!'; }
}

/* ====== 削除 ====== */
async function delVideo(id){
  if(!confirm('この動画を削除しますか？\n（アプリの表示からも消えます）')) return;
  var card = $('list').querySelector('.vid[data-id="'+id+'"]'); if(card) card.style.opacity='.4';
  var r = await call('del', {key:KEY, id:id});
  if(r && r.ok){ toast('削除しました'); reload(); }
  else { if(card) card.style.opacity='1'; toast('削除失敗：' + ((r&&r.error)||''), true); }
}

/* ====== 修正 ====== */
function startEdit(id){ editingId = id; renderList();
  var card = $('list').querySelector('.vid[data-id="'+id+'"]');
  if(card){ try{ card.scrollIntoView({behavior:'smooth', block:'center'}); }catch(e){} var t=card.querySelector('.etitle'); if(t) t.focus(); }
}
function cancelEdit(){ editingId = null; renderList(); }

async function saveEdit(id){
  var card = $('list').querySelector('.vid[data-id="'+id+'"]'); if(!card) return;
  var title = card.querySelector('.etitle').value.trim();
  var urlv  = card.querySelector('.eurl').value.trim();
  var em    = card.querySelector('.emsg');
  var orig  = VIDS.filter(function(x){ return String(x.id)===String(id); })[0] || {};
  var changedUrl = !!urlv && urlv !== (orig.url||'');
  if(urlv && !/^https?:\/\//i.test(urlv)){ em.className='emsg err'; em.textContent='URLは https://… の形で'; return; }
  if(!title && !changedUrl){ em.className='emsg err'; em.textContent='タイトルを入力するか、URLを差し替えてください'; return; }
  var params = { key:KEY, id:id, title:title };
  if(changedUrl) params.url = urlv;
  em.className='emsg run'; em.innerHTML='<span class="spin"></span>保存中…';
  var r = await call('edit', params);
  if(r && r.ok){ toast('✓ 修正しました'); editingId=null; reload(); }
  else if(r && r.error==='forbidden'){ toast('鍵が無効です', true); showGate(); }
  else { em.className='emsg err'; em.textContent='× ' + ((r&&r.error)||'修正に失敗しました'); }
}

/* ====== イベント ====== */
$('unlockBtn').addEventListener('click', unlock);
$('keyIn').addEventListener('keydown', function(e){ if(e.key==='Enter') unlock(); });
$('tabAdd').addEventListener('click', function(){ switchTab('add'); });
$('tabMng').addEventListener('click', function(){ switchTab('manage'); });
$('checkBtn').addEventListener('click', previewVideo);
$('urlIn').addEventListener('keydown', function(e){ if(e.key==='Enter') previewVideo(); });
$('commitBtn').addEventListener('click', commitVideo);
$('resetBtn').addEventListener('click', function(){ resetPreview(); $('urlIn').value=''; $('urlIn').focus(); });
$('reloadBtn').addEventListener('click', reload);
$('reloadBtn2').addEventListener('click', reload);
$('keyBtn').addEventListener('click', function(){ try{ localStorage.removeItem(KEYLS); }catch(e){} KEY=''; showGate(); });
$('list').addEventListener('click', function(e){
  var b;
  if((b=e.target.closest('[data-edit]')))   { startEdit(b.getAttribute('data-edit')); return; }
  if((b=e.target.closest('[data-del]')))    { delVideo(b.getAttribute('data-del')); return; }
  if((b=e.target.closest('[data-save]')))   { saveEdit(b.getAttribute('data-save')); return; }
  if((b=e.target.closest('[data-cancel]'))) { cancelEdit(); return; }
});

/* ====== 起動：保存済みの鍵があれば自動ログイン ====== */
(function init(){
  var k=''; try{ k = localStorage.getItem(KEYLS) || ''; }catch(e){}
  if(k){ $('keyIn').value = k; unlock(); }
})();
</script>
